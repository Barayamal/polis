name: Deploy to AWS on Push

on: workflow_dispatch

permissions: {}

env:
  # Reviewed against the official v5.3.1 Linux x86_64 release on 29 July 2026.
  DOCKER_COMPOSE_VERSION: v5.3.1
  DOCKER_COMPOSE_LINUX_X86_64_SHA256: f9ebc6ebdb19d769b793c245a736caaeb198c62587f13b25c660c13b4987f959

jobs:
  # ==========================================================
  # ==      JOB 1: BUILD & PUSH DOCKER IMAGES (US ONLY)     ==
  # ==========================================================
  build-and-push-images:
    name: Build and Push Docker Images
    if: github.repository == 'compdemocracy/polis'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (for US ECR)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Install Docker Compose
        run: |
          compose_binary="$RUNNER_TEMP/docker-compose"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --output "$compose_binary" \
            "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64"
          printf '%s  %s\n' \
            "$DOCKER_COMPOSE_LINUX_X86_64_SHA256" \
            "$compose_binary" \
            | sha256sum --check -
          sudo install -m 0755 "$compose_binary" /usr/local/bin/docker-compose
          docker-compose version

      - name: Build and push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker-compose build server
          docker push $ECR_REGISTRY/polis/server:latest

          docker-compose build math
          docker push $ECR_REGISTRY/polis/math:latest

  # =====================================================
  # ==      JOB 2: DEPLOY TO PRODUCTION (US)           ==
  # =====================================================
  deploy-us:
    name: Deploy to Production (US)
    if: github.repository == 'compdemocracy/polis'
    runs-on: ubuntu-24.04
    needs: build-and-push-images
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials for US
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create US deployment package
        run: zip -r deployment-us.zip appspec.yml scripts/* docker-compose.yml

      - name: Upload US deployment package to S3
        run: aws s3 cp deployment-us.zip s3://polis-deployment-packages-050917022930-us-east-1/deployments/deployment.zip

      - name: Create US CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name PolisApplication \
            --deployment-group-name PolisDeploymentGroup \
            --revision revisionType=S3,s3Location="{bucket=polis-deployment-packages-050917022930-us-east-1,key=deployments/deployment.zip,bundleType=zip}" \
            --region us-east-1

  # ================================================
  # ==      JOB 3: DEPLOY TO EUROPE               ==
  # ================================================
  deploy-euro:
    name: Deploy to Europe
    if: github.repository == 'compdemocracy/polis'
    runs-on: ubuntu-24.04
    needs: build-and-push-images
    environment: europe
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials for Europe
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_EURO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_EURO }}
          aws-region: eu-central-1

      - name: Create Euro deployment package
        run: |
          # 1. Create a clean staging directory
          mkdir staging_dir

          # 2. Copy and RENAME appspec-euro.yml to appspec.yml inside the staging dir
          cp appspec-euro.yml staging_dir/appspec.yml

          # 3. Copy the other necessary files and directories into the staging dir
          cp -r scripts-euro staging_dir/
          cp docker-compose.yml staging_dir/

          # 4. Go into the staging directory and create the zip from there
          cd staging_dir
          zip -r ../deployment-euro.zip .

      - name: Upload Euro deployment package to S3
        run: aws s3 cp deployment-euro.zip s3://polis-deployment-packages-954495807218-eu-central-1/deployments/deployment.zip

      - name: Create Euro CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name PolisApplication \
            --deployment-group-name PolisDeploymentGroup \
            --revision revisionType=S3,s3Location="{bucket=polis-deployment-packages-954495807218-eu-central-1,key=deployments/deployment.zip,bundleType=zip}" \
            --region eu-central-1
