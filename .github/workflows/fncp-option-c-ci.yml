name: FNCP Option C PR gate

on:
  pull_request:
    branches: [edge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fncp-option-c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Deployment and evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate shell entrypoints
        run: |
          sh -n deploy/fncp/collect-image-security-evidence.sh
          sh -n deploy/fncp/prepare-staging.sh
          sh -n deploy/fncp/smoke-test.sh
          sh -n deploy/fncp/verify-staging.sh
          sh -n server/bin/fncp-run-migrations.sh

      - name: Run synthetic deployment and evidence tests
        run: |
          node --test \
            deploy/fncp/audit-production-dependencies.test.mjs \
            deploy/fncp/deployment-boundary.test.mjs \
            deploy/fncp/image-security-evidence.test.mjs \
            deploy/fncp/migration-image.test.mjs \
            deploy/fncp/provider-allowlist-boundary.test.mjs

      - name: Reject whitespace errors
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git show --check --format= HEAD
          fi

  server:
    name: Server build and query safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: fncp_query_builder_ci
          POSTGRES_PASSWORD: fncp-disposable-ci
          POSTGRES_USER: fncp_ci
        options: >-
          --health-cmd "pg_isready -U fncp_ci -d fncp_query_builder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      CI: "true"
      DATABASE_URL: postgresql://fncp_ci:fncp-disposable-ci@127.0.0.1:5432/fncp_query_builder_ci
      NODE_ENV: test
      QUERY_BUILDER_DATABASE_URL: postgresql://fncp_ci:fncp-disposable-ci@127.0.0.1:5432/fncp_query_builder_ci
      READ_ONLY_DATABASE_URL: postgresql://fncp_ci:fncp-disposable-ci@127.0.0.1:5432/fncp_query_builder_ci
      TESTING: "true"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install locked dependencies
        working-directory: server
        run: npm ci

      - name: Create disposable JWT keys
        run: |
          mkdir -p "$RUNNER_TEMP/fncp-jwt"
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/fncp-jwt/private.pem"
          openssl rsa \
            -pubout \
            -in "$RUNNER_TEMP/fncp-jwt/private.pem" \
            -out "$RUNNER_TEMP/fncp-jwt/public.pem"
          {
            echo "JWT_PRIVATE_KEY_PATH=$RUNNER_TEMP/fncp-jwt/private.pem"
            echo "JWT_PUBLIC_KEY_PATH=$RUNNER_TEMP/fncp-jwt/public.pem"
          } >> "$GITHUB_ENV"

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Build
        working-directory: server
        run: npm run build

      - name: Run isolated non-database unit suite
        working-directory: server
        run: >-
          npm run test:unit --
          --config jest.fncp.config.ts
          --runInBand

      - name: Run isolated PostgreSQL integrations
        working-directory: server
        run: >-
          npm test --
          --config jest.fncp.config.ts
          --runInBand
          __tests__/integration/postgres-query-builder.test.ts
          __tests__/integration/fncp-provider-allowlist-store.test.ts

  participant-alpha:
    name: Participant alpha boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client-participation-alpha/package-lock.json

      - name: Install locked dependencies
        working-directory: client-participation-alpha
        run: npm ci

      - name: Lint
        working-directory: client-participation-alpha
        run: npm run lint

      - name: Run tests
        working-directory: client-participation-alpha
        run: npm test -- --runInBand

      - name: Verify source boundary
        working-directory: client-participation-alpha
        run: npm run test:fncp-boundaries

      - name: Build
        working-directory: client-participation-alpha
        run: npm run build

      - name: Verify built boundary
        working-directory: client-participation-alpha
        run: npm run test:fncp-built-boundaries

  math:
    name: Math source tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned math test stage
        run: >-
          docker build
          --target build
          --tag fncp-math-ci:${{ github.sha }}
          math

      - name: Run pure Clojure tests
        run: >-
          docker run --rm
          --entrypoint clojure
          fncp-math-ci:${{ github.sha }}
          -M:test

  runtime-images:
    name: Runtime image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service:
          - server
          - math
          - client-participation-alpha
          - nginx-proxy
          - polis-migration
    env:
      IMAGE: fncp-${{ matrix.service }}-runtime:${{ github.sha }}
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build exact runtime stage
        shell: bash
        run: |
          set -euo pipefail
          case "$SERVICE" in
            server)
              docker build \
                --pull \
                --no-cache \
                --target prod \
                --tag "$IMAGE" \
                server
              ;;
            math)
              docker build \
                --pull \
                --no-cache \
                --target runtime \
                --tag "$IMAGE" \
                math
              ;;
            client-participation-alpha)
              docker build \
                --pull \
                --no-cache \
                --target runtime \
                --build-arg PUBLIC_SERVICE_URL=https://fncp.invalid \
                --build-arg INTERNAL_SERVICE_URL=http://server:5000 \
                --build-arg OIDC_CACHE_KEY_PREFIX=fncp.ci \
                --build-arg OIDC_CACHE_KEY_ID_TOKEN_SUFFIX=@@fncp-ci@@ \
                --build-arg PUBLIC_AUTH_NAMESPACE=https://fncp.invalid/ \
                --tag "$IMAGE" \
                client-participation-alpha
              ;;
            nginx-proxy)
              docker build \
                --pull \
                --no-cache \
                --file deploy/fncp/nginx/Dockerfile \
                --tag "$IMAGE" \
                deploy/fncp
              ;;
            polis-migration)
              docker build \
                --pull \
                --no-cache \
                --file server/Dockerfile-migrate \
                --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
                --tag "$IMAGE" \
                server
              ;;
            *)
              echo "Unknown runtime image service: $SERVICE" >&2
              exit 2
              ;;
          esac

      - name: Require a non-root runtime and reviewed contents
        shell: bash
        run: |
          set -euo pipefail
          configured_user="$(docker image inspect \
            --format '{{.Config.User}}' "$IMAGE")"
          case "$configured_user" in
            ""|0|0:*|root|root:*)
              echo "$SERVICE has an unsafe configured user: $configured_user" >&2
              exit 1
              ;;
          esac

          case "$SERVICE" in
            server)
              docker run --rm --entrypoint sh "$IMAGE" -euc '
                test "$(id -u)" -ne 0
                apk info --exists "libpq=18.4-r0"
                apk info --exists "openssl=3.5.7-r0"
                apk info --exists "ca-certificates=20260611-r0"
                test -r /app/dist/index.js
                test -r /app/src/prompts/moderation/script.xml
                test -r /app/src/prompts/report_experimental/system.xml
                test ! -e /app/package-lock.json
                test ! -e /app/node_modules/jest
                for command in corepack npm npx pnpm pnpx yarn yarnpkg; do
                  ! command -v "$command"
                done
              '
              ;;
            math)
              docker run --rm --entrypoint sh "$IMAGE" -euc '
                test "$(id -u)" -ne 0
                test -x /app/bin/run
                test -r /app/classpath
                test ! -e /app/deps.edn
                test ! -e /usr/local/lib/clojure
                test ! -e /usr/local/bin/clj
                test ! -e /usr/local/bin/clojure
              '
              ;;
            client-participation-alpha)
              docker run --rm --entrypoint sh "$IMAGE" -euc '
                test "$(id -u)" -ne 0
                test -r /app/dist/server/entry.mjs
                test ! -e /app/package-lock.json
                test ! -e /app/node_modules/jest
                for command in corepack npm npx pnpm pnpx yarn yarnpkg; do
                  ! command -v "$command"
                done
                test -z "$(find /app/node_modules -type d \
                  \( -name "@astrojs" -o -name "@esbuild" -o \
                     -name "@oxc-project" -o -name "@rolldown" -o \
                     -name "@types" -o -name "@vitejs" -o \
                     -name "astro" -o -name "esbuild" -o \
                     -name "lightningcss" -o -name "lightningcss-*" -o \
                     -name "rolldown" -o -name "sharp" -o \
                     -name "vite" -o -path "*/@img/sharp-*" \) \
                  -print -quit)"
                for path in \
                  /app/node_modules/.bin/astro \
                  /app/node_modules/.bin/rolldown \
                  /app/node_modules/.bin/vite; do
                  test ! -e "$path"
                  test ! -L "$path"
                done
              '
              container_name="fncp-participant-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
              docker run \
                --detach \
                --name "$container_name" \
                --publish 127.0.0.1:14321:4321 \
                "$IMAGE"
              for attempt in {1..15}; do
                status="$(curl \
                  --silent \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  http://127.0.0.1:14321/ || true)"
                if [ "$status" = 404 ]; then
                  break
                fi
                if ! docker container inspect "$container_name" \
                  --format '{{.State.Running}}' | grep -qx true; then
                  docker logs "$container_name" >&2
                  exit 1
                fi
                sleep 1
              done
              test "$status" = 404
              ;;
            nginx-proxy)
              docker run --rm --entrypoint sh "$IMAGE" -euc '
                test "$(id -u)" -ne 0
                test -r /etc/nginx/conf.d/default.conf
                grep -q "listen 8080 default_server;" \
                  /etc/nginx/conf.d/default.conf
              '
              container_name="fncp-nginx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
              docker run \
                --detach \
                --name "$container_name" \
                --add-host server:127.0.0.1 \
                --add-host client-participation-alpha:127.0.0.1 \
                --publish 127.0.0.1:18080:8080 \
                "$IMAGE"
              for attempt in {1..15}; do
                status="$(curl \
                  --silent \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  http://127.0.0.1:18080/ || true)"
                if [ "$status" = 404 ]; then
                  break
                fi
                if ! docker container inspect "$container_name" \
                  --format '{{.State.Running}}' | grep -qx true; then
                  docker logs "$container_name" >&2
                  exit 1
                fi
                sleep 1
              done
              test "$status" = 404
              ;;
            polis-migration)
              test "$(docker image inspect \
                --format '{{json .Config.Entrypoint}}' "$IMAGE")" = \
                '["/usr/local/bin/fncp-run-migrations"]'
              test "$(docker image inspect \
                --format '{{json .Config.Cmd}}' "$IMAGE")" = 'null'
              test "$(docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                "$IMAGE")" = "$GITHUB_SHA"
              test "$(docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
                "$IMAGE")" = "https://github.com/Barayamal/polis"
              test "$(docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' \
                "$IMAGE")" = \
                "sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193"
              test "$(docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.base.name" }}' \
                "$IMAGE")" = "docker.io/library/postgres:17-alpine"
              docker run --rm --entrypoint sh "$IMAGE" -euc '
                test "$(id -u)" -ne 0
                test -x /usr/local/bin/fncp-run-migrations
                for required_command in \
                  cat find mktemp psql rm sha256sum sh sort tr wc; do
                  command -v "$required_command" >/dev/null
                done
                for forbidden_command in \
                  clusterdb createdb createuser docker-enforce-initdb.sh \
                  docker-ensure-initdb.sh docker-entrypoint.sh \
                  dropdb dropuser ecpg gosu initdb \
                  oid2name pg_amcheck pg_archivecleanup pg_basebackup pgbench \
                  pg_checksums pg_combinebackup pg_config pg_controldata \
                  pg_createsubscriber pg_ctl pg_dump pg_dumpall pg_isready \
                  pg_receivewal \
                  pg_recvlogical pg_resetwal pg_restore pg_rewind \
                  pg_test_fsync pg_test_timing pg_upgrade pg_verifybackup \
                  pg_waldump pg_walsummary postmaster postgres reindexdb \
                  vacuumdb vacuumlo; do
                  ! command -v "$forbidden_command" >/dev/null
                done
                test ! -e /docker-entrypoint-initdb.d
                test "$(find /opt/fncp/migrations -mindepth 1 -maxdepth 1 \
                  -type f -name "*.sql" | wc -l | tr -d " ")" -gt 0
                test -z "$(find /opt/fncp/migrations \
                  -mindepth 2 -print -quit)"
              '
              ;;
          esac

  fncp-pr-gate:
    name: FNCP PR gate
    if: always()
    needs: [contracts, server, participant-alpha, math, runtime-images]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every synthetic-only check
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          SERVER: ${{ needs.server.result }}
          PARTICIPANT_ALPHA: ${{ needs.participant-alpha.result }}
          MATH: ${{ needs.math.result }}
          RUNTIME_IMAGES: ${{ needs.runtime-images.result }}
        run: |
          test "$CONTRACTS" = success
          test "$SERVER" = success
          test "$PARTICIPANT_ALPHA" = success
          test "$MATH" = success
          test "$RUNTIME_IMAGES" = success
