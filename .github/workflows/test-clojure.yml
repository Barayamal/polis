name: Test Math

concurrency:
  group: test-clojure-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["dev", "504-clj-tests"]
    # Note: Only configured for client-admin right now.
    paths:
      - .github/workflows/test-clojure.yml
      - math/**
  pull_request:
    types: ["opened", "reopened", "synchronize"]
    paths:
      - .github/workflows/test-clojure.yml
      - math/**

jobs:
  test-clj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: adopt
          java-version: 16.0.2

      - name: Install Clojure tooling
        uses: DeLaGuardo/setup-clojure@bc7570e912b028bbcc22f457adec7fdf98e2f4ed # 12.5
        with:
          cli: 1.10.1.693

      - name: Run Clojure tests
        working-directory: math
        # Runs all except integration tests which require database and setup/teardown
        run: "clojure -M:test"
