name: Test Math

concurrency:
  group: test-clojure-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["dev", "504-clj-tests"]
    # Note: Only configured for client-admin right now.
    paths:
      - .github/workflows/test-clojure.yml
      - math/**
  pull_request:
    types: ["opened", "reopened", "synchronize"]
    paths:
      - .github/workflows/test-clojure.yml
      - math/**

permissions: {}

jobs:
  test-clj:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: adopt
          java-version: 16.0.2

      - name: Install Clojure tooling
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # v13.6.1
        with:
          cli: 1.10.1.693

      - name: Run Clojure tests
        working-directory: math
        # Runs all except integration tests which require database and setup/teardown
        run: "clojure -M:test"
