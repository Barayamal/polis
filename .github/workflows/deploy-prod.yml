name: Deploy Prod Assets

# `cancel-in-progress: false` collapses the queue without killing an
# in-flight deploy: during a rapid series of pushes to stable, the running
# deploy finishes and only the newest queued commit deploys afterwards.
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - stable

permissions: {}

jobs:
  # ==========================================================
  # ==      JOB 1: DEPLOY STATIC ASSETS TO PRODUCTION (US)  ==
  # ==========================================================
  deploy-static-us:
    name: Deploy Static Assets (US)
    if: github.repository == 'compdemocracy/polis'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS Credentials (US)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{secrets.AWS_PROD_ROLE_ARN}}
          role-session-name: GitHubActionsDeployProdUS
          aws-region: us-east-1

      - name: Create empty .env file
        run: touch .env

      - name: Build static assets (US)
        env:
          EMBED_SERVICE_HOSTNAME: pol.is
          GA_TRACKING_ID: G-WVP78N35QR
          SERVICE_URL: https://pol.is
          AUTH_AUDIENCE: users
          AUTH_CLIENT_ID: ${{secrets.AUTH_CLIENT_ID}}
          AUTH_ISSUER: https://compdem.us.auth0.com/
          NODE_ENV: production
          OIDC_CACHE_KEY_PREFIX: oidc.user
          OIDC_CACHE_KEY_ID_TOKEN_SUFFIX: "@@user@@"
          AUTH_NAMESPACE: https://pol.is/
          ADMIN_UIDS: ${{secrets.ADMIN_UIDS}}
        run: |
          docker compose create --build --force-recreate file-server
          CONTAINER_ID=$(docker ps -qaf name=file-server)
          docker cp ${CONTAINER_ID}:/app/build/ ./build

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r deploy/requirements.txt

      - name: Deploy to S3 (US)
        run: python deploy/deploy-static-assets.py --source build --bucket prod.static-assets.pol.is

  # =====================================================
  # ==      JOB 2: DEPLOY STATIC ASSETS TO EUROPE      ==
  # =====================================================
  deploy-static-euro:
    name: Deploy Static Assets (Europe)
    if: github.repository == 'compdemocracy/polis'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS Credentials (Europe)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{secrets.AWS_EURO_ROLE_ARN}}
          role-session-name: GitHubActionsDeployProdEuro
          aws-region: eu-central-1

      - name: Create empty .env file
        run: touch .env

      - name: Build static assets (Europe)
        env:
          EMBED_SERVICE_HOSTNAME: euro.pol.is
          GA_TRACKING_ID: G-WVP78N35QR
          SERVICE_URL: https://euro.pol.is
          AUTH_AUDIENCE: users
          AUTH_CLIENT_ID: ${{secrets.AUTH_CLIENT_ID_EURO}}
          AUTH_ISSUER: https://compdem.eu.auth0.com/
          NODE_ENV: production
          OIDC_CACHE_KEY_PREFIX: oidc.user
          OIDC_CACHE_KEY_ID_TOKEN_SUFFIX: "@@user@@"
          AUTH_NAMESPACE: https://euro.pol.is/
          ADMIN_UIDS: ${{secrets.ADMIN_UIDS}}
        run: |
          docker compose create --build --force-recreate file-server
          CONTAINER_ID=$(docker ps -qaf name=file-server)
          # Euro build is copied to its own separate directory
          docker cp ${CONTAINER_ID}:/app/build/ ./build-euro

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r deploy/requirements.txt

      - name: Deploy to S3 (Europe)
        run: python deploy/deploy-static-assets.py --source build-euro --bucket euro.static-assets.pol.is
