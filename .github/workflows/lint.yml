name: Lint

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: ["opened", "reopened", "synchronize"]

permissions: {}

jobs:
  eslint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Get npm cache directory
      id: npm-cache
      run: |
        echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

    - name: Restore npm cache directory
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.npm-cache.outputs.dir }}
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: "Install & Build: client-admin"
      working-directory: client-admin
      run: npm install

    - name: "ESLint: client-admin"
      working-directory: client-admin
      run: npm run lint

    - name: "Install & Build: server"
      working-directory: server
      run: npm install

    - name: "ESLint: server"
      working-directory: server
      run: npm run lint

    - name: "Install & Build: client-report"
      working-directory: client-report
      run: npm install

    - name: "ESLint: client-report"
      working-directory: client-report
      run: npm run lint

    - name: "Install & Build: e2e"
      working-directory: e2e
      run: npm install

    - name: "ESLint: e2e"
      working-directory: e2e
      run: npm run lint
