name: Lint

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: ["opened", "reopened", "synchronize"]

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24

    - name: Verify GitHub Action pins and allowlist
      run: node .github/scripts/check-action-pins.mjs

    - name: Get npm cache directory
      id: npm-cache
      run: |
        echo "::set-output name=dir::$(npm config get cache)"

    - name: Restore npm cache directory
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.npm-cache.outputs.dir }}
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: "Install & Build: client-admin"
      working-directory: client-admin
      run: npm install

    - name: "ESLint: client-admin"
      working-directory: client-admin
      run: npm run lint

    - name: "Install & Build: server"
      working-directory: server
      run: npm install

    - name: "ESLint: server"
      working-directory: server
      run: npm run lint

    - name: "Install & Build: client-report"
      working-directory: client-report
      run: npm install

    - name: "ESLint: client-report"
      working-directory: client-report
      run: npm run lint

    - name: "Install & Build: e2e"
      working-directory: e2e
      run: npm install

    - name: "ESLint: e2e"
      working-directory: e2e
      run: npm run lint
