name: Run Jest Tests - client admin

concurrency:
  group: jest-client-admin-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'client-admin/**'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client-admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client-admin

      - name: Run Jest tests with coverage
        run: npm run test:coverage
        working-directory: client-admin

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: client-admin/coverage
          flags: client-admin
          name: client-admin-coverage
          fail_ci_if_error: false
