name: Deploy Preprod Assets

# `cancel-in-progress: false` collapses the queue without killing an
# in-flight deploy: during a rapid series of pushes to edge (e.g. a stack
# merge), the running deploy finishes and only the newest queued commit
# deploys afterwards. Intermediate queued deploys get cancelled.
concurrency:
  group: deploy-preprod-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - edge

permissions: {}

jobs:
  deploy-static:
    if: github.repository == 'compdemocracy/polis'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{secrets.AWS_PREPROD_ROLE_ARN}}
          role-session-name: GitHubActionsDeployPreprod
          aws-region: us-east-1

      - name: Create empty .env file
        run: touch .env

      - name: Build static assets
        env:
          EMBED_SERVICE_HOSTNAME: preprod.pol.is
          GA_TRACKING_ID: G-WVP78N35QR
          SERVICE_URL: https://preprod.pol.is
        run: |
          docker compose create --build --force-recreate file-server
          CONTAINER_ID=$(docker ps -qaf name=file-server)
          docker cp ${CONTAINER_ID}:/app/build/ ./build

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -r deploy/requirements.txt

      - name: Deploy to S3
        run: |
          python deploy/deploy-static-assets.py --bucket edge.static-assets.pol.is
