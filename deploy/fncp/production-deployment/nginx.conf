worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 16k;
  client_body_buffer_size 16k;
  client_header_timeout 5s;
  client_body_timeout 5s;
  send_timeout 5s;
  keepalive_timeout 0;
  limit_conn_zone $server_name zone=private_connections:1m;
  server {
    listen 8443 ssl default_server;
    server_name polis-proxy;
    ssl_certificate /run/fncp/proxy-cert.pem;
    ssl_certificate_key /run/fncp/proxy-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    limit_conn private_connections 128;
    if ($host != polis-proxy) { return 444; }
    location = /fncp/private/xid-allowlist/upsert { limit_except POST { deny all; } include /etc/nginx/fncp-upstream.conf; }
    location = /fncp/private/xid-allowlist/remove { limit_except POST { deny all; } include /etc/nginx/fncp-upstream.conf; }
    location = /fncp/private/xid-allowlist/readback { limit_except POST { deny all; } include /etc/nginx/fncp-upstream.conf; }
    location = /api/v3/participationInit { limit_except GET { deny all; } include /etc/nginx/fncp-upstream.conf; }
    location = /api/v3/nextComment { limit_except GET { deny all; } include /etc/nginx/fncp-upstream.conf; }
    location = /api/v3/votes { limit_except POST { deny all; } include /etc/nginx/fncp-upstream.conf; }
    location / { return 404; }
  }
}
