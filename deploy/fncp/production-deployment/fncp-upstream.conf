# Only this fixed private service receives gateway/provider credentials.
proxy_pass http://api:5000;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_set_header Host polis.local.invalid;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-FNCP-Gateway-Key $http_x_fncp_gateway_key;
proxy_set_header X-FNCP-Conversation-Id $http_x_fncp_conversation_id;
proxy_set_header X-FNCP-Participant-Xid $http_x_fncp_participant_xid;
proxy_set_header Authorization $http_authorization;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Accept application/json;
proxy_set_header Connection close;
proxy_connect_timeout 3s;
proxy_read_timeout 5s;
proxy_send_timeout 5s;
proxy_request_buffering on;
proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 8 32k;
proxy_max_temp_file_size 0;
proxy_next_upstream off;
proxy_hide_header Set-Cookie;
proxy_hide_header Server;
add_header Cache-Control "no-store, private" always;
