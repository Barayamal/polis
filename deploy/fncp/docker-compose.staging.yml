# Disposable, loopback-only Pol.is origin for First Nations Community Pulse QA.
# This is deliberately not a production topology and must never contain genuine
# registration, eligibility or participation data.
services:
  postgres:
    build:
      context: ../../server
      dockerfile: Dockerfile-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [fncp-internal]
    restart: unless-stopped
    volumes:
      - fncp-postgres:/var/lib/postgresql/data

  oidc-simulator:
    build:
      context: ../../oidc-simulator
      dockerfile: Dockerfile
    environment:
      AUTH_AUDIENCE: ${AUTH_AUDIENCE}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_SIMULATOR_PORT: ${AUTH_SIMULATOR_PORT}
      CERT_DIR: /root/.simulacrum/certs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --cacert /root/.simulacrum/certs/rootCA.pem -f https://localhost:3000/.well-known/jwks.json",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [fncp-internal, fncp-loopback]
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - ./certs:/root/.simulacrum/certs:ro

  server:
    build:
      context: ../../server
      dockerfile: Dockerfile
      target: prod
      args:
        NODE_ENV: production
    depends_on:
      oidc-simulator:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env.staging
    environment:
      DATABASE_SSL: "false"
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
      NODE_EXTRA_CA_CERTS: /root/.simulacrum/certs/rootCA.pem
    networks: [fncp-internal, fncp-loopback]
    ports:
      - "127.0.0.1:5500:5000"
    restart: unless-stopped
    volumes:
      - ./certs:/root/.simulacrum/certs:ro
      - ../../server/keys:/app/keys:ro

  math:
    build:
      context: ../../math
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOGGING_LEVEL: ${MATH_LOG_LEVEL:-warn}
      MATH_ENV: ${MATH_ENV:-dev}
      WEBSERVER_PASS: ${WEBSERVER_PASS}
      WEBSERVER_USERNAME: ${WEBSERVER_USERNAME}
    networks: [fncp-internal]
    restart: unless-stopped

  client-participation-alpha:
    build:
      context: ../../client-participation-alpha
      dockerfile: Dockerfile
      args:
        AUTH_NAMESPACE: ${AUTH_NAMESPACE}
        OIDC_CACHE_KEY_ID_TOKEN_SUFFIX: ${OIDC_CACHE_KEY_ID_TOKEN_SUFFIX}
        OIDC_CACHE_KEY_PREFIX: ${OIDC_CACHE_KEY_PREFIX}
        PUBLIC_SERVICE_URL: ${PUBLIC_SERVICE_URL}
    depends_on: [server]
    environment:
      INTERNAL_SERVICE_URL: ${INTERNAL_SERVICE_URL}
      PUBLIC_AUTH_NAMESPACE: ${AUTH_NAMESPACE}
      PUBLIC_OIDC_CACHE_KEY_ID_TOKEN_SUFFIX: ${OIDC_CACHE_KEY_ID_TOKEN_SUFFIX}
      PUBLIC_OIDC_CACHE_KEY_PREFIX: ${OIDC_CACHE_KEY_PREFIX}
      PUBLIC_SERVICE_URL: ${PUBLIC_SERVICE_URL}
    networks: [fncp-internal]
    restart: unless-stopped

  file-server:
    build:
      context: ../..
      dockerfile: file-server/Dockerfile
      args:
        ADMIN_UIDS: ${ADMIN_UIDS}
        AUTH_AUDIENCE: ${AUTH_AUDIENCE}
        AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
        AUTH_ISSUER: ${AUTH_ISSUER}
        AUTH_NAMESPACE: ${AUTH_NAMESPACE}
        DD_APPLICATION_ID: ""
        DD_CLIENT_TOKEN: ""
        DD_SITE: ""
        EMBED_SERVICE_HOSTNAME: ${EMBED_SERVICE_HOSTNAME}
        GA_TRACKING_ID: ""
        GIT_HASH: ${GIT_HASH}
        NODE_ENV: production
        OIDC_CACHE_KEY_ID_TOKEN_SUFFIX: ${OIDC_CACHE_KEY_ID_TOKEN_SUFFIX}
        OIDC_CACHE_KEY_PREFIX: ${OIDC_CACHE_KEY_PREFIX}
    depends_on: [server]
    environment:
      PORT: "8080"
    networks: [fncp-internal]
    restart: unless-stopped

  nginx-proxy:
    build:
      context: ../../file-server
      dockerfile: nginx.Dockerfile
    depends_on:
      - client-participation-alpha
      - file-server
      - server
    environment:
      API_SERVER_PORT: "5000"
    networks: [fncp-internal, fncp-loopback]
    ports:
      - "127.0.0.1:8088:80"
    restart: unless-stopped

networks:
  fncp-internal:
    internal: true
  # Only the three explicitly loopback-published services join this bridge.
  # Docker/Colima cannot publish host ports from an internal-only network.
  fncp-loopback:

volumes:
  fncp-postgres:
