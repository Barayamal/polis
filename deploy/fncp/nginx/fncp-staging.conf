# Disposable, loopback-only FNCP QA proxy. This is intentionally not an
# internet-ready TLS boundary.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # FNCP votes and 140-character statements need only small JSON envelopes.
    # The participant path never accepts uploads.
    client_max_body_size 8k;

    location ^~ /_astro/ {
        proxy_pass http://client-participation-alpha:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10;
        proxy_send_timeout 30;
        proxy_read_timeout 30;
    }

    location ^~ /alpha/ {
        rewrite ^/alpha/(.*)$ /$1 break;
        proxy_pass http://client-participation-alpha:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10;
        proxy_send_timeout 30;
        proxy_read_timeout 30;
    }

    # The participant client has exactly six API capabilities. The server-side
    # gateway remains authoritative for method, identity, conversation and
    # field enforcement; this proxy only removes unrelated route families.
    location = /api/v3/comments {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v3/math/pca2 {
        if ($request_method !~ ^(GET)$) { return 405; }
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v3/nextComment {
        if ($request_method !~ ^(GET)$) { return 405; }
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v3/participationInit {
        if ($request_method !~ ^(GET)$) { return 405; }
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v3/votes {
        if ($request_method !~ ^(POST)$) { return 405; }
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No native participant, admin, report, export or legacy static fallback.
    location / {
        return 404;
    }
}
